name: Lint & Build

on:
  - push
  - pull_request

jobs:
  lint_and_build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1
          run_install: false
      - run: pnpm install --frozen-lockfile --ignore-scripts --prod=false
      - run: pnpm rebuild --pending
      - run: pnpm lint
      - run: pnpm test:runtime-lifecycle
      - run: pnpm build-all:ci
